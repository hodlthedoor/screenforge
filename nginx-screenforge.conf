# ScreenForge nginx reverse proxy with SSL
# Install: sudo cp nginx-screenforge.conf /etc/nginx/sites-available/screenforge
#          sudo ln -s /etc/nginx/sites-available/screenforge /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

# Rate limiting zone: 10 req/s per IP
limit_req_zone $binary_remote_addr zone=screenforge_limit:10m rate=10r/s;

upstream screenforge_backend {
    server 127.0.0.1:3100;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name screenforge.local;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name screenforge.local;

    # SSL certificates
    ssl_certificate /etc/ssl/certs/screenforge.crt;
    ssl_certificate_key /etc/ssl/private/screenforge.key;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Max upload size for HTML content submissions
    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain text/html text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    # Health check (no rate limit)
    location /health {
        proxy_pass http://screenforge_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints with rate limiting
    location /v1/ {
        limit_req zone=screenforge_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://screenforge_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running renders
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # All other routes (dashboard, docs, auth, landing)
    location / {
        limit_req zone=screenforge_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://screenforge_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
