[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenforge"
version = "1.5.0"
description = "Official Python SDK for ScreenForge screenshot, PDF, and OG image API"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "ScreenForge", email = "support@screenforge.dev"}
]
keywords = ["screenshot", "pdf", "og-image", "api", "screenforge"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.20.0",
]

[project.urls]
Homepage = "https://screenforge.dev"
Documentation = "https://docs.screenforge.dev"
Repository = "https://github.com/hodlthedoor/screenforge"
"Bug Tracker" = "https://github.com/hodlthedoor/screenforge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
