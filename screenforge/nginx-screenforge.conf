# ScreenForge nginx reverse proxy
# Install: sudo cp nginx-screenforge.conf /etc/nginx/sites-available/screenforge
#          sudo ln -s /etc/nginx/sites-available/screenforge /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

# Rate limiting zone: 10 req/s per IP
limit_req_zone $binary_remote_addr zone=screenforge_limit:10m rate=10r/s;

upstream screenforge_backend {
    server 127.0.0.1:3101;
    keepalive 32;
}

server {
    listen 80;
    server_name screenforge.local;

    # Max upload size for HTML content submissions
    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain text/html text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    # Health check (no rate limit)
    location /health {
        proxy_pass http://screenforge_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints with rate limiting
    location /v1/ {
        limit_req zone=screenforge_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://screenforge_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running renders
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # WebSocket support (for SSE polling)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # All other routes (dashboard, docs, auth, landing)
    location / {
        limit_req zone=screenforge_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://screenforge_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
