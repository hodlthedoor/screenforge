# Probot stale configuration
# https://github.com/probot/stale

# Number of days of inactivity before an issue becomes stale
daysUntilStale: 60

# Number of days of inactivity before a stale issue is closed
daysUntilClose: 7

# Label to use when marking as stale
staleLabel: stale

# Comment posted when marking an issue as stale
markComment: >
  This issue has been automatically marked as stale because it has not had recent activity.
  It will be closed in 7 days if no further activity occurs.
  Thank you for your contributions!

# Comment posted when closing a stale issue
closeComment: >
  This issue has been automatically closed due to inactivity.
  If this is still relevant, please reopen it or create a new issue with updated information.

# Issues with these labels are exempt from being marked stale
exemptLabels:
  - pinned
  - security

# Set to true to ignore issues in a project (defaults to false)
exemptProjects: false

# Set to true to ignore issues in a milestone (defaults to false)
exemptMilestones: false

# Limit the number of actions per hour (defaults to 30)
limitPerRun: 30
